app = 'loqui-chain'
primary_region = 'gru'

[build]

[deploy]
  strategy = 'immediate'

[env]
  PORT = '3001'
  APP_URL = 'https://chain.loquiprojects.com'
  DB_PATH = '/data/cadena.sqlite'

[[mounts]]
  source = 'loqui_chain_data'
  destination = '/data'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
