# Copiar a .github/workflows/fly-deploy.yml en el repo del producto nuevo.
# Ajustar `branches` a la rama real de deploy si no es `main`.
# Requiere el secret FLY_API_TOKEN en el repo (ver docs/CHECKLIST.md §4).
# Ver https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - master
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
