<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="pig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbcfe1"/>
      <stop offset="1" stop-color="#f6a8c8"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- background (full-bleed for maskable) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- coin dropping into slot -->
  <g transform="rotate(-12 256 150)">
    <circle cx="256" cy="150" r="34" fill="url(#coin)" stroke="#d97706" stroke-width="5"/>
    <text x="256" y="166" font-family="Arial, sans-serif" font-size="40" font-weight="700"
          text-anchor="middle" fill="#b45309">$</text>
  </g>

  <!-- piggy -->
  <g stroke="#e879a9" stroke-width="6" stroke-linejoin="round">
    <!-- legs -->
    <rect x="170" y="330" width="36" height="52" rx="14" fill="#f190b8"/>
    <rect x="300" y="330" width="36" height="52" rx="14" fill="#f190b8"/>
    <!-- ear -->
    <path d="M176 214 l44 2 -20 46 z" fill="#f49ac0"/>
    <!-- body -->
    <ellipse cx="256" cy="286" rx="132" ry="98" fill="url(#pig)"/>
    <!-- snout -->
    <ellipse cx="366" cy="282" rx="40" ry="46" fill="#f49ac0"/>
  </g>
  <!-- coin slot on back -->
  <rect x="222" y="196" width="78" height="14" rx="7" fill="#be5c88" transform="rotate(-9 261 203)"/>
  <!-- nostrils -->
  <ellipse cx="358" cy="282" rx="6.5" ry="11" fill="#c76e97"/>
  <ellipse cx="378" cy="282" rx="6.5" ry="11" fill="#c76e97"/>
  <!-- eye -->
  <circle cx="300" cy="250" r="12" fill="#3f2a33"/>
  <circle cx="304" cy="246" r="4" fill="#fff"/>
  <!-- curly tail -->
  <path d="M126 276 q-26 -6 -22 -28 q4 -20 24 -14" fill="none" stroke="#e879a9" stroke-width="12" stroke-linecap="round"/>
</svg>
